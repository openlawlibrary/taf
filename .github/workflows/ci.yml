name: CI

on:
  push: {}
  pull_request:
    types: [closed]
  release:
    types: [created]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  VERSIONS: "['3.10', '3.11', '3.12', '3.13']"
  LAST_VERSION: "3.13"

jobs:
  set_python_versions:
    runs-on: ubuntu-latest
    outputs:
      all_versions: ${{ steps.step1.outputs.matrix }}
      last_version: ${{ steps.step1.outputs.last_version }}
    steps:
      - name: Set versions
        id: step1
        run: |
          echo "matrix=${{env.VERSIONS}}" >> $GITHUB_OUTPUT
          echo "last_version=${{env.LAST_VERSION}}" >> $GITHUB_OUTPUT

  run_tests:
    runs-on: ubuntu-latest
    needs: set_python_versions
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.set_python_versions.outputs.all_versions) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b #@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip, setuptools, and wheel
        run: |
          pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libhdf5-serial-dev zlib1g-dev libatlas-base-dev lcov swig3.0 libpcsclite-dev
          mkdir -p ~/bin/ && ln -s /usr/bin/swig3.0 ~/bin/swig && export PATH=~/bin/:$PATH
          pip install wheel  # Ensure wheel is installed
          pip install -e .[ci,test,yubikey]

      - name: Setup GitHub user
        run: |
          git config --global user.name oll-bot
          git config --global user.email developers@openlawlib.org

      - name: Run pre-commit and test with pytest
        run: |
          pre-commit run --all-files
          pytest taf/tests

  run_tests_windows:
    runs-on: windows-latest
    needs: set_python_versions
    defaults:
      run:
        shell: bash
    steps:
      # before checkout, so the checkout uses these settings
      - name: Setup Git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git config --global user.name oll-bot
          git config --global user.email developers@openlawlib.org

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #@v4

      # repositories created by the tests use the Git for Windows default
      - name: Use default line endings
        run: git config --global core.autocrlf true

      - name: Set up Python ${{ needs.set_python_versions.outputs.last_version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b #@v5
        with:
          python-version: ${{ needs.set_python_versions.outputs.last_version }}

      - name: Install dependencies
        run: |
          choco install swig
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[test,yubikey]

      # the full updater tests take long on Windows, so other pushes run all other
      # tests and only the valid clone and update tests
      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            pytest taf/tests
          else
            status=0
            pytest taf/tests --ignore=taf/tests/test_updater || status=1
            pytest taf/tests/test_updater/test_clone/test_clone_valid.py taf/tests/test_updater/test_update/test_update_valid.py || status=1
            exit $status
          fi

  # master's benchmarks run in the same job, since times measured on
  # different runners can't be compared
  run_benchmarks:
    runs-on: ubuntu-latest
    needs: set_python_versions
    if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/master'
    env:
      BENCHMARK_STORAGE: file://${{ github.workspace }}/.benchmarks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #@v4

      - name: Set up Python ${{ needs.set_python_versions.outputs.last_version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b #@v5
        with:
          python-version: ${{ needs.set_python_versions.outputs.last_version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e .[test]

      - name: Setup GitHub user
        run: |
          git config --global user.name oll-bot
          git config --global user.email developers@openlawlib.org

      - name: Check out master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #@v4
        with:
          ref: master
          path: master

      - name: Run master's benchmark tests
        working-directory: master
        env:
          PYTHONPATH: ${{ github.workspace }}/master
        run: pytest taf/tests/test_updater -o python_files='benchmark_*.py' --benchmark-storage="$BENCHMARK_STORAGE" --benchmark-save=master

      - name: Run benchmark tests
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          threshold=$(jq --arg branch "$BRANCH" '.[$branch] // 20' benchmark_thresholds.json)
          echo "Comparing against master with a threshold of $threshold%"
          pytest taf/tests/test_updater -o python_files='benchmark_*.py' --benchmark-storage="$BENCHMARK_STORAGE" --benchmark-compare=0001 --benchmark-compare-fail=min:$threshold%

  build_and_upload_wheel:
    runs-on: ubuntu-latest
    needs: [set_python_versions, run_tests, run_tests_windows, build-and-test-executables]
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #@v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b #@v5
        with:
          # build it on the minimum version
          python-version: ${{ fromJSON(needs.set_python_versions.outputs.all_versions)[0] }}

      - name: Upgrade pip
        run: |
          pip install --upgrade pip setuptools wheel

      - name: Install swig
        run: |
          sudo apt-get update
          sudo apt-get install libhdf5-serial-dev zlib1g-dev libatlas-base-dev lcov swig3.0 libpcsclite-dev
          mkdir -p ~/bin/ && ln -s /usr/bin/swig3.0 ~/bin/swig && export PATH=~/bin/:$PATH

      - name: Install and build TAF
        run: |
          pip install .[yubikey]
          python setup.py sdist bdist_wheel clean --all

      - name: Install publishing dependencies
        run: |
          pip install packaging
          pip install twine==3.8.0

      - name: Upload wheels to PyPI
        run: |
          twine check dist/*
          twine upload dist/*
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}


  build-and-test-executables:
    needs: [set_python_versions, run_tests]
    if: github.event_name == 'release' || github.ref == 'refs/heads/master'

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #@v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b #@v5
        with:
          # the newest python that we support
          python-version: ${{ needs.set_python_versions.outputs.last_version }}

      - name: Upgrade pip windows
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Upgrade pip
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        run: |
          pip install --upgrade pip setuptools wheel

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install libhdf5-serial-dev zlib1g-dev libatlas-base-dev lcov swig3.0 libpcsclite-dev
          mkdir -p ~/bin/ && ln -s /usr/bin/swig3.0 ~/bin/swig && export PATH=~/bin/:$PATH

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        run: |
          choco install swig

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install swig

      - name: Install dependencies
        run: |
          pip install .[yubikey]
          pip install .[executable]
          pip install pyinstaller

      # the executable gets a single libssl, so it has to be the newer one
      # ssl needs, not the older copy pygit2 ships with
      - name: Use Python's OpenSSL in pygit2 (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          python_lib="$(python -c 'import sys; print(sys.base_prefix)')/lib"
          pygit2_dylibs="$(python -c 'import os, pygit2; print(os.path.dirname(pygit2.__file__))')/.dylibs"
          cp "$python_lib/libssl.3.dylib" "$python_lib/libcrypto.3.dylib" "$pygit2_dylibs/"

      - name: Build and test standalone executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --onefile --hidden-import=yubikey_manager --hidden-import=lxml --collect-submodules taf.tools --add-data "taf/resources:taf/resources" --copy-metadata taf --name taf-linux -y taf/tools/cli/taf.py
          chmod +x dist/taf-linux
          ./dist/taf-linux --help | grep "TAF Command Line Interface" || { echo "Error: Expected text not found in the executable output"; exit 1; }
          ./dist/taf-linux --version

      - name: Build and test standalone executable (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          pyinstaller --onefile --hidden-import=yubikey_manager --hidden-import=lxml --collect-submodules taf.tools --add-data "taf/resources:taf/resources" --copy-metadata taf --name taf-windows.exe -y taf/tools/cli/taf.py
          ./dist/taf-windows.exe --help | grep "TAF Command Line Interface" || { echo "Error: Expected text not found in the executable output"; exit 1; }
          ./dist/taf-windows.exe --version

      - name: Build and test standalone executable (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --onefile --hidden-import=yubikey_manager --hidden-import=lxml --collect-submodules taf.tools --add-data "taf/resources:taf/resources" --copy-metadata taf --name taf-macos -y taf/tools/cli/taf.py
          ./dist/taf-macos --help | grep "TAF Command Line Interface" || { echo "Error: Expected text not found in the executable output"; exit 1; }
          ./dist/taf-macos --version

      - name: Keep standalone executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #@v7.0.1
        with:
          name: executable-${{ matrix.os }}
          path: dist/taf-*

  upload_executables:
    runs-on: ubuntu-latest
    needs: [build-and-test-executables, build_and_upload_wheel]
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: Download standalone executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #@v8.0.1
        with:
          pattern: executable-*
          merge-multiple: true
          path: dist

      - name: Upload standalone executables
        run: |
          gh release upload ${{ github.event.release.tag_name }} dist/* --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
